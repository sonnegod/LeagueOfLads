name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} # Using password instead of key
          script: |
            set -e
            # Navigate to the project folder
            cd ~/LeagueOfLads
            
            # Pull latest code
            git pull origin main

            # Validate the runtime before installing native SQLite/client dependencies
            node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (!((major === 20 && minor >= 19) || (major === 22 && minor >= 12) || major > 22)) { console.error("Node 20.19+ or 22.12+ is required; Node 22.12+ is recommended."); process.exit(1); }'
            
            # Build the Client
            cd client
            npm install
            npm run build
            sudo cp -r dist/* /var/www/leagueoflads/
            
            # Back up and migrate the EDW before restarting the server
            cd ..
            npm install
            node scripts/db/migrateWarehouse.js db/LadsData.db --apply
            pm2 restart all
