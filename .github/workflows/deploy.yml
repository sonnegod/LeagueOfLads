name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} # Using password instead of key
          script: |
            # Navigate to the project folder
            cd ~/LeagueOfLads
            
            # Pull latest code
            git pull origin main
            
            # Build the Client
            cd client
            npm install
            npm run build
            sudo cp -r dist/* /var/www/leagueoflads/
            
            # (Optional) Restart the server if you are using PM2
            cd ..
            npm install
            pm2 restart all