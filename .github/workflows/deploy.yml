name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} # Using password instead of key
          script: |
            set -e
            # Navigate to the project folder
            cd ~/LeagueOfLads
            
            # Pull latest code
            git pull origin main
            
            # Install server dependencies and verify the documented runtime.
            node -e 'const [major,minor]=process.versions.node.split(".").map(Number); if(major<22 || major===22 && minor<12) throw new Error("Node 22.12+ is required")'
            npm install

            # Build before changing the published client.
            cd client
            npm install
            npm run build
            
            cd ..
            # Back up before additive migrations. Initialize roster history before
            # Analytics reads it; Betting owns market creation and settlement.
            bash scripts/db/backupDatabases.sh
            node scripts/betting/run.js --init-only
            node scripts/analytics/build.js
            node scripts/betting/run.js
            sudo cp -r client/dist/* /var/www/leagueoflads/
            pm2 restart all
